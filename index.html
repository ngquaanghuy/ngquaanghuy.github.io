<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giới thiệu cá nhân — Tên của bạn</title>
  <meta name="description" content="Trang giới thiệu cá nhân" />

  <!-- ========== DỮ LIỆU CẦN SỬA (chỉnh trong file HTML này) ==========
       1. Tên            : tìm "Tên của bạn"
       2. Avatar         : thay src ảnh trong <img class="avatar">
       3. Facebook       : thay href="https://facebook.com/yourname"
       4. TikTok         : thay href="https://tiktok.com/@yourname"
       5. Chia sẻ tài liệu: sửa block <script type="text/plain" id="doc-data">
          (mỗi dòng 1 mục:  Tên | Mô tả | Link ; dòng # là chú thích)
       → Trên web khách chỉ xem (read only), muốn đổi phải sửa file này.
  ============================================================= -->

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --fb: #1877f2;
      --tt: #25f4ee;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e3a5f 0%, var(--bg) 55%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent);
      margin-bottom: 18px;
      background: #334155;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .role {
      color: var(--accent);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .bio {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 26px;
    }

    .socials {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .social:hover { transform: translateY(-3px); }

    .facebook { background: var(--fb); box-shadow: 0 6px 18px rgba(24, 119, 242, 0.35); }
    .tiktok   { background: #010101; box-shadow: 0 6px 18px rgba(37, 244, 238, 0.25); color: var(--tt); }

    .social svg { width: 18px; height: 18px; fill: currentColor; }

    /* ----- Khu vực chia sẻ tài liệu ----- */
    .docs {
      margin-top: 32px;
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 24px;
    }

    .docs h2 {
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 16px;
      color: var(--text);
    }

    .doc-list {
      display: grid;
      gap: 12px;
    }

    .doc {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }

    .doc:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .doc-icon {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 1.1rem;
    }

    .doc-info { flex: 1; min-width: 0; }

    .doc-title {
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
    }

    .doc-desc {
      font-size: 0.8rem;
      color: var(--muted);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 14px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
    }

    footer {
      margin-top: 26px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Avatar: thay src bằng link ảnh của bạn -->
    <img
      class="avatar"
      src="https://i.pinimg.com/736x/fa/58/cb/fa58cbe6e1e7dbad7762bda2b72219e5.jpg"
      alt="Ảnh đại diện"
    />

    <!-- Tên của bạn -->
    <h1>Nguyễn Quang Huy</h1>

    <!-- Chức danh / nghề nghiệp -->
    <p class="role">Người cute đáng yêu phô mai que nhất hành tinh</p>

    <!-- Giới thiệu ngắn -->
    <p class="bio">
      Tui lập ra trang web này chỉ với mục đích lưu giữ và chia sẻ các tài liệu
      trong quá trình học tập mà mình tìm kiếm được, nên đừng toxic nhen
    </p>

    <div class="socials">
      <!-- Link Facebook: thay href bằng trang cá nhân của bạn -->
      <a class="social facebook" href="https://www.facebook.com/ngquanghuy15.02" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/>
        </svg>
        Facebook
      </a>

      <!-- Link TikTok: thay href bằng trang cá nhân của bạn -->
      <a class="social tiktok" href="https://tiktok.com/@djtquanghuy" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.6 5.8a5 5 0 0 1-1-3.3h-3v13a2.5 2.5 0 1 1-2.5-2.5c.3 0 .5 0 .8.1V10a5.5 5.5 0 1 0 4.7 5.4V9.3a8 8 0 0 0 4.6 1.5v-3a5 5 0 0 1-3.6-2z"/>
        </svg>
        TikTok
      </a>
    </div>

    <!-- ========== CHIA SẺ TÀI LIỆU (read only trên web) ========== -->
    <section class="docs">
      <h2>📑 Chia sẻ tài liệu</h2>
      <div class="doc-list" id="docList"><!-- JS render từ block dữ liệu bên dưới --></div>
    </section>

    <!-- ========== BLOCK DỮ LIỆU TÀI LIỆU — SỬA Ở ĐÂY ==========
         Mỗi dòng 1 mục, phân cách bằng dấu | :  Tên | Mô tả | Link
         Dòng bắt đầu bằng # là chú thích (bỏ qua)
         Thêm/bớt dòng = thêm/bớt tài liệu -->
    <script type="text/plain" id="doc-data">
# Tài liệu — mỗi dòng: Ten | Mo ta | Link
48 ngày lấy gốc cô Mai Phương | Terabox | https://1024terabox.com/s/1LnboR-vik5q5oSX9T9QbcQ
21 ngày xây nền tiếng anh cô Phạm Liễu | Terabox | https://1024terabox.com/s/1oNKRXCnzT69WCqz8VOJT3w
Tổng hợp đề cương toán 9 giữa HK 1 10 trường | Terabox | https://1024terabox.com/s/1KJPZnmRlmkWy8Jz3zIhtdw
Tổng hợp từ điển Anh Việt | Terabox | https://1024terabox.com/s/1ZD_J8KoxsdtOdEbycqPRiQ
Nâng cấp vốn từ Nâng tầm diễn đạt Ver 1 | Drive | https://drive.google.com/file/d/1MK-gvhYzt-dblCYkb1yOWrQMxSZ2vU1r/view?usp=sharing
Nâng cấp vốn từ Nâng tầm diễn đạt Ver 2 | Drive | https://drive.google.com/file/d/1NHwIwurI7Xf0F7A_Epu5sLyYEQLP5PhD/view?usp=sharing
Trích Dẫn Tâm Đắc-Dẫn Chứng Thuyết Phục quyển 1 | Drive | https://drive.google.com/file/d/1c057rAgSXl_ZJ_nhzuQe86TKS2qiUV1k/view?usp=sharing
Trích Dẫn Tâm Đắc-Dẫn Chứng Thuyết Phục quyển 2 | Drive | https://drive.google.com/file/d/1YRmkv7LTnkTMfcsXd5BbR_3WdkrjHA1A/view?usp=sharing
    </script>

    <footer>© 2026 — Trang giới thiệu cá nhân</footer>
  </main>

  <script>
    const ICONS = ["📄", "📊", "🗂️", "📘", "📕", "📙", "📁", "📎"];
    const docList = document.getElementById("docList");

    // ----- Đọc block dữ liệu #doc-data (mỗi dòng: Tên | Mô tả | Link) -----
    function parseTxt(text) {
      return text
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line && !line.startsWith("#"))
        .map((line) => {
          const [title = "", desc = "", url = ""] = line.split("|").map((s) => s.trim());
          return { title, desc, url };
        })
        .filter((d) => d.title && d.url);
    }

    // ----- Render danh sách (read only, click để mở link) -----
    function render(docs) {
      docList.innerHTML = "";
      if (!docs.length) {
        docList.innerHTML = '<div class="doc-empty">Chưa có tài liệu nào.</div>';
        return;
      }

      docs.forEach((d, i) => {
        const a = document.createElement("a");
        a.className = "doc";
        a.href = d.url;
        a.target = "_blank";
        a.rel = "noopener";

        const icon = document.createElement("span");
        icon.className = "doc-icon";
        icon.textContent = ICONS[i % ICONS.length];

        const info = document.createElement("span");
        info.className = "doc-info";

        const title = document.createElement("span");
        title.className = "doc-title";
        title.textContent = d.title;

        const desc = document.createElement("span");
        desc.className = "doc-desc";
        desc.textContent = d.desc || d.url;

        info.append(title, desc);
        a.append(icon, info);
        docList.appendChild(a);
      });
    }

    const dataEl = document.getElementById("doc-data");
    render(parseTxt(dataEl ? dataEl.textContent : ""));
  </script>
</body>
</html>
